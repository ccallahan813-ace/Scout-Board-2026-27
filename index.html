function gradeToColor(g){
  if(!g) return C.silver;
  const v=parseFloat(g);
  if(v>=9.0) return '#4B92DB';
  if(v>=8.0) return '#C8102E';
  if(v>=6.5) return '#C9942A';
  if(v>=5.9) return '#222222';
  if(v>=5.5) return '#2E7D32';
  if(v>=5.0) return '#6A1B9A';
  return '#5D4037';
}

const STATUS_S={
  'Not Started':{bg:'#0a1a2a',text:C.silver,border:'#1e3a5f'},
  'Draft':{bg:'#0a1500',text:'#9ACD32',border:'#2a4000'},

function ColorDot({grade,size=10}){
  const col=gradeToColor(grade);
  return <span style={{display:'inline-block',width:size,height:size,borderRadius:'50%',background:col,flexShrink:0,border:col==='#222222'?'1px solid #666':'none'}}/>;

function StatusPill({status}){

  return <span style={{background:s.bg,color:s.text,border:`1px solid ${s.border}`,fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:20,letterSpacing:'0.05em',whiteSpace:'nowrap'}}>{status}</span>;

}

}

function PinScreen({onUnlock}){
  const [entry,setEntry]=useState('');
  const [shake,setShake]=useState(false);
  const [error,setError]=useState(false);
  function handleDigit(d){
    if(entry.length>=4) return;
    const next=entry+d;
    setEntry(next);
    if(next.length===4){
      if(next===PIN){setTimeout(()=>onUnlock(),150);}
      else{setShake(true);setError(true);setTimeout(()=>{setShake(false);setEntry('');setError(false)},800);}
    }
  }
  const keys=[['1','2','3'],['4','5','6'],['7','8','9'],['','0','⌫']];
  return(
    <div style={{position:'fixed',inset:0,background:C.navyD,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:999}}>
      <div style={{marginBottom:48,textAlign:'center'}}>
        <div style={{fontSize:11,color:C.blue,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:6}}>Tennessee Titans · 2026-27</div>
        <div style={{fontSize:28,fontWeight:800,color:C.white,letterSpacing:'-0.02em'}}>Scout Board</div>
      </div>
      <div style={{display:'flex',gap:16,marginBottom:48,animation:shake?'shake 0.6s ease':'none'}}>
        {[0,1,2,3].map(i=>(
          <div key={i} style={{width:16,height:16,borderRadius:'50%',background:i<entry.length?(error?C.red:C.blue):'transparent',border:`2px solid ${i<entry.length?(error?C.red:C.blue):C.line}`,transition:'all 0.15s'}}/>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12,width:240}}>
        {keys.flat().map((k,i)=>(
          k===''?<div key={i}/>:
          <button key={i} onClick={()=>k==='⌫'?setEntry(e=>e.slice(0,-1)):handleDigit(k)}
            style={{background:k==='⌫'?'none':C.navyL,border:k==='⌫'?'none':`1px solid ${C.line}`,borderRadius:12,height:64,color:C.white,fontSize:k==='⌫'?20:22,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
            {k}
          </button>
        ))}
      </div>
    </div>
  );
}

function ImportModal({onClose,onImported}){
  const [school,setSchool]=useState('');
  const [preview,setPreview]=useState([]);
  const [importing,setImporting]=useState(false);
  const [done,setDone]=useState(false);
  const fileRef=useRef();
  function handleFile(e){
    const file=e.target.files[0];
    if(!file) return;
    Papa.parse(file,{
      header:true,skipEmptyLines:true,
      complete:({data})=>{
        const rows=data.map(r=>{
          const last=r.LAST||r.last||r.Last||'';
          const first=r.FIRST||r.first||r.First||'';
          const name=r.name||r.Name||r.NAME||(last&&first?`${first} ${last}`:last||first)||'';
          const pos=r.POS||r.pos||r.position||r.Position||r.FOOTBALL||'';
          const jersey=r.JSY||r.jsy||r.jersey||r.Jersey||r['#']||'';
          const ht=r.HT||'';const wt=r.WT||'';const spd=r.SPD||'';
          const arm=r.ARM||'';const hand=r.HAND||'';const wing=r.WING||'';
          const schoolVal=school||r.SCHOOL||r.school||r.School||'';
          return {name,position:pos,jersey,school:schoolVal,ht,wt,spd,arm,hand,wing};
        }).filter(r=>r.name);
        setPreview(rows);
      }
    });
  }
  async function confirmImport(){
    if(!preview.length) return;
    setImporting(true);
    const rows=preview.map(r=>({name:r.name,position:r.position,jersey:r.jersey,school:r.school,status:'Not Started',ht:r.ht||'',wt:r.wt||'',spd:r.spd||'',arm:r.arm||'',hand:r.hand||'',wing:r.wing||'',char_notes:'',nfs_notes:'',eval_notes:'',summer_eval:''}));
    const {error}=await sb.from('prospects').upsert(rows,{onConflict:'name,school'});
    setImporting(false);
    if(!error){setDone(true);setTimeout(()=>{onImported();onClose();},1200);}
    else{alert('Import error: '+error.message);}
  }
  return(
    <div style={{position:'fixed',inset:0,zIndex:200,background:'rgba(0,0,0,0.92)',display:'flex',alignItems:'flex-end'}} onClick={onClose}>
      <div style={{background:C.navyD,width:'100%',maxHeight:'85vh',borderRadius:'20px 20px 0 0',overflow:'hidden',display:'flex',flexDirection:'column',border:`1px solid ${C.line}`}} onClick={e=>e.stopPropagation()}>
        <div style={{background:C.navy,padding:'18px 20px',borderBottom:`1px solid ${C.line}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{color:C.white,fontWeight:800,fontSize:17}}>📂 Import Roster</div>
          <button onClick={onClose} style={{background:'none',border:'none',color:C.silver,fontSize:22,cursor:'pointer'}}>✕</button>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:20}}>
          {done?(
            <div style={{textAlign:'center',padding:'40px 0',color:'#9ACD32',fontSize:16,fontWeight:700}}>✓ Imported {preview.length} prospects</div>
          ):(
            <>
              <div style={{marginBottom:14}}>
                <div style={{color:C.silverL,fontSize:11,fontWeight:700,letterSpacing:'0.08em',marginBottom:6}}>SCHOOL NAME</div>
                <input value={school} onChange={e=>setSchool(e.target.value)} placeholder="e.g. University of Tennessee"
                  style={{width:'100%',background:C.navyL,border:`1px solid ${C.line}`,borderRadius:10,color:C.white,padding:'10px 14px',fontSize:14,boxSizing:'border-box'}}/>
              </div>
              <div style={{marginBottom:14}}>
                <div style={{color:C.silverL,fontSize:11,fontWeight:700,letterSpacing:'0.08em',marginBottom:6}}>CSV / EXCEL FILE</div>
                <div style={{color:C.silver,fontSize:12,marginBottom:8,lineHeight:1.5}}>Columns: LAST, FIRST, JSY, POS, SCHOOL, HT, WT, SPD, ARM, HAND, WING</div>
                <button onClick={()=>fileRef.current.click()} style={{width:'100%',background:C.navyL,border:`1px dashed ${C.blue}`,color:C.blue,borderRadius:10,padding:'14px 0',fontSize:14,fontWeight:600,cursor:'pointer'}}>
                  Tap to select file
                </button>
                <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" onChange={handleFile} style={{display:'none'}}/>
              </div>
              {preview.length>0&&(
                <>
                  <div style={{color:C.silverL,fontSize:11,fontWeight:700,letterSpacing:'0.08em',marginBottom:8}}>{preview.length} PROSPECTS FOUND</div>
                  <div style={{maxHeight:200,overflowY:'auto',marginBottom:16}}>
                    {preview.map((r,i)=>(
                      <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderBottom:`1px solid ${C.line}`,fontSize:13}}>
                        <span style={{color:C.white}}>{r.name}</span>
                        <span style={{color:C.silver}}>{r.position} · #{r.jersey} · {r.school}</span>
                      </div>
                    ))}
                  </div>
                  <button onClick={confirmImport} disabled={importing} style={{width:'100%',background:C.red,color:'#fff',border:'none',borderRadius:10,padding:'13px 0',fontSize:15,fontWeight:700,cursor:'pointer'}}>
                    {importing?'Importing…':`Import ${preview.length} Prospects`}
                  </button>
                </>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <ColorDot grade={p.grade} size={9}/>
                  <div>
                    <div style={{color:C.white,fontWeight:700}}>{p.name}</div>
                    <div style={{color:C.silver,fontSize:12}}>#{p.jersey} · {p.position}</div>
                  </div>
                </div>
                <StatusPill status={p.status}/>
              </div>
              <MeasurablesRow p={p}/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [unlocked,setUnlocked]=useState(false);
  const [tab,setTab]=useState('prospects');
  const [prospects,setProspects]=useState([]);
  const [schools,setSchools]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState('');
  const [posFilter,setPosFilter]=useState('All');
  const [statusFilter,setStatusFilter]=useState('All');
  const [selectedProspect,setSelectedProspect]=useState(null);
  const [selectedSchool,setSelectedSchool]=useState(null);
  const [showImport,setShowImport]=useState(false);

  useEffect(()=>{
    const last=parseInt(localStorage.getItem('sb_auth_time')||'0');
    if(Date.now()-last<PIN_TIMEOUT) setUnlocked(true);
  },[]);

  function unlock(){
    localStorage.setItem('sb_auth_time',Date.now().toString());
    setUnlocked(true);
  }

  async function load(){
    setLoading(true);
    const [{data:ps},{data:sc}]=await Promise.all([
      sb.from('prospects').select('*').order('name'),
      sb.from('schools').select('*').order('name'),
    ]);
    setProspects(ps||[]);
    const schoolNames=[...new Set((ps||[]).map(p=>p.school).filter(Boolean))];
    const schoolMap={};
    (sc||[]).forEach(s=>{schoolMap[s.name]=s;});
    setSchools(schoolNames.map(name=>schoolMap[name]||{name,visit_type:'First Visit'}));
    setLoading(false);
  }

  useEffect(()=>{if(unlocked) load();},[unlocked]);

  function updateProspect(updated){
    setProspects(prev=>prev.map(p=>p.id===updated.id?updated:p));
  }

  const filtered=prospects.filter(p=>{
    const q=search.toLowerCase();
    const mS=!q||p.name?.toLowerCase().includes(q)||p.school?.toLowerCase().includes(q)||p.jersey?.includes(q);
    const mP=posFilter==='All'||p.position===posFilter;
    const mSt=statusFilter==='All'||p.status===statusFilter;
    return mS&&mP&&mSt;
  }).sort((a,b)=>parseFloat(b.grade||0)-parseFloat(a.grade||0));

  if(!unlocked) return <PinScreen onUnlock={unlock}/>;

  return(
    <div style={{background:C.navyD,minHeight:'100vh',maxWidth:960,margin:'0 auto',padding:'0'}}>
      <div style={{background:C.navy,padding:'16px 20px 0',borderBottom:`1px solid ${C.line}`,position:'sticky',top:0,zIndex:10}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div>
            <div style={{fontSize:10,color:C.blue,fontWeight:700,letterSpacing:'0.14em',textTransform:'uppercase'}}>Tennessee Titans · 2026-27</div>
            <div style={{fontSize:24,fontWeight:800,letterSpacing:'-0.02em',color:C.white}}>Scout Board</div>
          </div>
          <button onClick={()=>setShowImport(true)} style={{background:C.navyL,border:`1px solid ${C.line}`,color:C.silverL,borderRadius:8,padding:'6px 10px',fontSize:18,cursor:'pointer'}}>📂</button>
        </div>
        <div style={{display:'flex'}}>
          {[{id:'prospects',label:'👤 Prospects'},{id:'schools',label:'🏫 Schools'}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,background:'none',border:'none',borderBottom:tab===t.id?`2px solid ${C.red}`:'2px solid transparent',color:tab===t.id?C.white:C.silver,padding:'8px 0 10px',fontSize:13,fontWeight:700,cursor:'pointer'}}>{t.label}</button>
          ))}
        </div>
      </div>

      {loading?<Spinner/>:(
        <>
          {tab==='prospects'&&(
            <div style={{padding:'14px 16px'}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search name, school, jersey #..."
                style={{width:'100%',background:C.navyL,border:`1px solid ${C.line}`,borderRadius:10,color:C.white,padding:'10px 14px',fontSize:14,marginBottom:10,boxSizing:'border-box'}}/>
              <div style={{display:'flex',gap:6,marginBottom:10,overflowX:'auto',paddingBottom:2}}>
                {['All','Not Started','Draft','Submitted'].map(s=>(
                  <button key={s} onClick={()=>setStatusFilter(s)} style={{background:statusFilter===s?C.red:C.navyL,border:`1px solid ${statusFilter===s?C.red:C.line}`,color:statusFilter===s?'#fff':C.silver,borderRadius:20,padding:'4px 12px',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>{s}</button>
                ))}
              </div>
              <div style={{display:'flex',gap:6,marginBottom:14,overflowX:'auto',paddingBottom:2}}>
                {POSITIONS.map(pos=>(
                  <button key={pos} onClick={()=>setPosFilter(pos)} style={{background:posFilter===pos?C.blue:C.navyL,border:`1px solid ${posFilter===pos?C.blue:C.line}`,color:posFilter===pos?'#fff':C.silver,borderRadius:20,padding:'4px 10px',fontSize:11,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>{pos}</button>
                ))}
              </div>
              <div style={{color:C.silver,fontSize:11,marginBottom:10,letterSpacing:'0.06em'}}>{filtered.length} PROSPECTS</div>
              {filtered.length===0&&(
                <div style={{textAlign:'center',padding:'40px 20px',color:C.silver}}>
                  <div style={{fontSize:32,marginBottom:10}}>📋</div>
                  <div style={{fontSize:14}}>No prospects yet — tap 📂 to import a roster</div>
                </div>
              )}
              {filtered.map(p=>(
                <div key={p.id} onClick={()=>setSelectedProspect(p)} style={{background:C.navyL,border:`1px solid ${C.line}`,borderLeft:`3px solid ${gradeToColor(p.grade)}`,borderRadius:10,padding:'12px 14px',marginBottom:10,cursor:'pointer'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <ColorDot grade={p.grade} size={9}/>
                      <div>
                        <div style={{color:C.white,fontWeight:700,fontSize:15}}>{p.name}</div>
                        <div style={{color:C.silver,fontSize:12}}>#{p.jersey} · {p.position} · {p.school}</div>
                      </div>
                    </div>
                    <StatusPill status={p.status}/>
                  </div>
                  <MeasurablesRow p={p}/>
                </div>
              ))}
            </div>
          )}
          {tab==='schools'&&(
            <div style={{padding:'14px 16px'}}>
              <div style={{color:C.silver,fontSize:11,marginBottom:10,letterSpacing:'0.06em'}}>{schools.length} SCHOOLS</div>
              {schools.length===0&&(
                <div style={{textAlign:'center',padding:'40px 20px',color:C.silver}}>
                  <div style={{fontSize:32,marginBottom:10}}>🏫</div>
                  <div style={{fontSize:14}}>No schools yet — import a roster to get started</div>
                </div>
              )}
              {schools.map(s=>{
                const sp=prospects.filter(p=>p.school===s.name).sort((a,b)=>parseFloat(b.grade||0)-parseFloat(a.grade||0));
                return(
                  <div key={s.name} onClick={()=>setSelectedSchool(s)} style={{background:C.navyL,border:`1px solid ${C.line}`,borderRadius:12,padding:'14px 16px',marginBottom:10,cursor:'pointer'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
                      <div>
                        <div style={{color:C.white,fontWeight:700,fontSize:16}}>🏫 {s.name}</div>
                        <div style={{color:C.silver,fontSize:12,marginTop:2}}>{sp.length} prospect{sp.length!==1?'s':''}</div>
                      </div>
                      <span style={{background:s.visit_type==='Return Visit'?'#001530':'#001a00',color:s.visit_type==='Return Visit'?C.blue:'#9ACD32',border:`1px solid ${s.visit_type==='Return Visit'?'#003060':'#1a4a00'}`,fontSize:10,fontWeight:700,padding:'3px 8px',borderRadius:20}}>{s.visit_type||'First Visit'}</span>
                    </div>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      {sp.map(p=>(<div key={p.id} style={{display:'flex',alignItems:'center',gap:4}}><ColorDot grade={p.grade} size={8}/><span style={{fontSize:10,color:C.silver}}>{p.position}</span></div>))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
      {selectedProspect&&<ProspectModal prospect={selectedProspect} onClose={()=>setSelectedProspect(null)} onSave={updateProspect}/>}
      {selectedSchool&&<SchoolModal school={selectedSchool} allProspects={prospects} onClose={()=>setSelectedSchool(null)} onProspect={p=>setSelectedProspect(p)}/>}
      {showImport&&<ImportModal onClose={()=>setShowImport(false)} onImported={load}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
